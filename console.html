<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0">

<title>Audience Light Console</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    background: #111;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body {
    padding: 20px;
}

h1 {
    margin: 0 0 25px;
    font-size: 24px;
}

.section {
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    opacity: .6;
}

input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #222;
    color: #fff;
    font-size: 16px;
}

button {
    border: 0;
    border-radius: 8px;
    height: 50px;
    padding: 0 20px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

#connectButton {
    width: 100%;
    margin-top: 10px;
    background: #fff;
    color: #000;
}

.status {
    padding: 15px;
    border-radius: 8px;
    background: #222;
}

#statusText {
    font-weight: 600;
}

#count {
    margin-top: 8px;
    font-size: 32px;
}

.controls {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.color {
    color: #fff;
}

#red {
    background: #e53935;
}

#green {
    background: #43a047;
}

#blue {
    background: #1976d2;
}

#white {
    background: #fff;
    color: #000;
}

#blink {
    background: #555;
}

#clear {
    background: #222;
    border: 1px solid #555;
}


/* ==========================================
   MASTER DIMMER
   ========================================== */

.masterBox {
    padding: 15px;
    border-radius: 8px;
    background: #222;
}

.masterHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.masterTitle {
    font-size: 13px;
    opacity: .6;
}

#opacityValue {
    font-size: 24px;
    font-weight: 700;
}

#opacitySlider {
    width: 100%;
    height: 40px;
    padding: 0;
    cursor: pointer;
    accent-color: #fff;
}


/* ==========================================
   ログ
   ========================================== */

.log {
    height: 150px;
    overflow-y: auto;
    padding: 10px;
    background: #000;
    border-radius: 8px;
    font-size: 12px;
    color: #aaa;
}

.beatButton {
    background: #333;
    color: #fff;
    border: 1px solid #555;
    height: 50px;
}

.beatButton.active {
    background: #fff;
    color: #000;
}

.savedColor {
    width: 100%;
    height: 55px;
    border-radius: 8px;
    border: 2px solid #555;
    cursor: pointer;
}

</style>

</head>


<body>

<h1>Audience Light Console</h1>


<!-- ==========================================
     ルーム
     ========================================== -->

<div class="section">

<label>ルーム</label>

<input
    id="roomInput"
    value="TEST"
    placeholder="例：TEST"
>

<button id="connectButton">
    接続
</button>

</div>


<!-- ==========================================
     ステータス
     ========================================== -->

<div class="section status">

<div id="statusText">
    🔴 未接続
</div>

<div id="count">
    0台
</div>

</div>


<!-- ==========================================
     演出
     ========================================== -->

<div class="section">

<label>演出</label>

<div class="controls">

<button
    id="red"
    class="color">
    R
</button>

<button
    id="green"
    class="color">
    G
</button>

<button
    id="blue"
    class="color">
    B
</button>

<button
    id="white"
    class="color">
    W
</button>

<button
    id="blink">
    点滅
</button>

<button
    id="clear">
    消灯
</button>

</div>

</div>


<!-- ==========================================
     MASTER DIMMER
     ========================================== -->

<div class="section">

<label>MASTER</label>

<div class="masterBox">

<div class="masterHeader">

<div class="masterTitle">
    COLOR OPACITY
</div>

<div id="opacityValue">
    100%
</div>

</div>

<input
    id="opacitySlider"
    type="range"
    min="0"
    max="100"
    step="1"
    value="100"
>

</div>

</div>


<!-- ==========================================
     カラー作成
     ========================================== -->

<div class="section">

<label>カラー作成</label>

<div style="
    display:grid;
    grid-template-columns:80px 1fr;
    gap:10px;
">

<input
    id="colorPicker"
    type="color"
    value="#ff0000"
    style="
        width:80px;
        padding:4px;
        cursor:pointer;
    "
>

<input
    id="hexInput"
    type="text"
    value="#ff0000"
    placeholder="#FF0000"
>

</div>


<button
    id="saveColor"
    style="
        width:100%;
        margin-top:10px;
        background:#fff;
        color:#000;
    "
>
    カラーを保存
</button>

</div>


<!-- ==========================================
     保存カラー
     ========================================== -->

<div class="section">

<label>保存カラー</label>

<div
    id="savedColors"
    style="
        display:grid;
        grid-template-columns:
            repeat(4, 1fr);
        gap:10px;
    "
>
</div>

</div>


<!-- ==========================================
     点滅設定
     ========================================== -->

<div class="section">

<label>点滅設定</label>

<input
    id="bpmInput"
    type="number"
    min="20"
    max="300"
    value="120"
    placeholder="BPM"
>


<div style="
    margin-top:10px;
    display:grid;
    grid-template-columns:
        repeat(4, 1fr);
    gap:8px;
">

<button
    class="beatButton"
    data-beat="0">
    ●
</button>

<button
    class="beatButton"
    data-beat="1">
    ○
</button>

<button
    class="beatButton"
    data-beat="2">
    ●
</button>

<button
    class="beatButton"
    data-beat="3">
    ○
</button>

</div>


<button
    id="saveBlink"
    style="
        width:100%;
        margin-top:10px;
        background:#fff;
        color:#000;
    "
>
    点滅設定を保存
</button>

</div>


<!-- ==========================================
     ログ
     ========================================== -->

<div class="section">

<label>ログ</label>

<div
    id="log"
    class="log">
</div>

</div>


<script>


/*
 * ==========================================
 * Worker URL
 * ==========================================
 */

const WORKER_URL =
    "https://audience-light.cell-lab.workers.dev";


/*
 * ==========================================
 * HTML
 * ==========================================
 */

const roomInput =
    document.getElementById("roomInput");

const connectButton =
    document.getElementById("connectButton");

const statusText =
    document.getElementById("statusText");

const count =
    document.getElementById("count");

const log =
    document.getElementById("log");


const colorPicker =
    document.getElementById("colorPicker");

const hexInput =
    document.getElementById("hexInput");

const saveColorButton =
    document.getElementById("saveColor");

const savedColors =
    document.getElementById("savedColors");


const bpmInput =
    document.getElementById("bpmInput");

const saveBlinkButton =
    document.getElementById("saveBlink");


/*
 * ==========================================
 * MASTER DIMMER
 * ==========================================
 */

const opacitySlider =
    document.getElementById(
        "opacitySlider"
    );

const opacityValue =
    document.getElementById(
        "opacityValue"
    );


const beatButtons =
    document.querySelectorAll(
        ".beatButton"
    );


/*
 * ==========================================
 * WebSocket
 * ==========================================
 */

let socket = null;


/*
 * ==========================================
 * 点滅パターン
 * ==========================================
 */

let blinkPattern = [
    1,
    0,
    1,
    0
];


/*
 * ==========================================
 * MASTER透明度
 * ==========================================
 */

let masterOpacity = 1;


/*
 * ==========================================
 * ログ
 * ==========================================
 */

function addLog(text) {

    const time =
        new Date()
            .toLocaleTimeString();


    log.innerHTML +=
        `[${time}] ${text}<br>`;


    log.scrollTop =
        log.scrollHeight;
}


/*
 * ==========================================
 * HEXチェック
 * ==========================================
 */

function normalizeColor(value) {

    let color =
        String(value)
            .trim()
            .toLowerCase();


    if (
        !color.startsWith("#")
    ) {

        color =
            "#" + color;

    }


    if (
        !/^#[0-9a-f]{6}$/i.test(color)
    ) {

        return null;
    }


    return color;
}


/*
 * ==========================================
 * カラーピッカー
 * ==========================================
 */

colorPicker.addEventListener(
    "input",
    () => {

        hexInput.value =
            colorPicker.value
                .toLowerCase();

    }
);


/*
 * ==========================================
 * HEX入力
 * ==========================================
 */

hexInput.addEventListener(
    "input",
    () => {

        const color =
            normalizeColor(
                hexInput.value
            );


        if (color) {

            colorPicker.value =
                color;

        }
    }
);


/*
 * ==========================================
 * MASTER DIMMER
 * ==========================================
 */

opacitySlider.addEventListener(
    "input",
    () => {

        const percent =
            Number(
                opacitySlider.value
            );


        masterOpacity =
            percent / 100;


        opacityValue.textContent =
            `${percent}%`;


        sendCommand({
            type: "opacity",
            value: masterOpacity
        });

    }
);


/*
 * ==========================================
 * MASTER透明度反映
 * ==========================================
 */

function applyOpacity(value) {

    let opacity =
        Number(value);


    if (
        !Number.isFinite(opacity)
    ) {

        opacity = 1;

    }


    opacity =
        Math.max(
            0,
            Math.min(
                1,
                opacity
            )
        );


    masterOpacity =
        opacity;


    const percent =
        Math.round(
            opacity * 100
        );


    opacitySlider.value =
        percent;


    opacityValue.textContent =
        `${percent}%`;
}


/*
 * ==========================================
 * 接続
 * ==========================================
 */

function connect() {

    const room =
        roomInput.value.trim();


    if (!room) {

        alert(
            "ルーム名を入力してください"
        );

        return;
    }


    if (socket) {

        socket.close();

    }


    const wsUrl =
        WORKER_URL
            .replace(/^http/, "ws")
        + "/room/"
        + encodeURIComponent(room);


    statusText.textContent =
        "🟡 接続中...";


    addLog(
        `接続開始：${room}`
    );


    socket =
        new WebSocket(wsUrl);


    /*
     * 接続成功
     */

    socket.onopen = () => {

        statusText.textContent =
            "🟢 接続中";


        addLog(
            "WebSocket接続成功"
        );


        sendCommand({
            type: "getSettings"
        });

    };


    /*
     * メッセージ
     */

    socket.onmessage = (event) => {

        try {

            const data =
                JSON.parse(
                    event.data
                );


            /*
             * 接続人数
             */

            if (
                data.type === "count"
            ) {

                count.textContent =
                    `${data.count}台`;

                return;
            }


            /*
             * ルーム設定
             */

            if (
                data.type === "settings"
            ) {

                applySettings(
                    data.settings
                );

                return;
            }


            /*
             * 他コンソールから
             * 透明度が変更された場合
             */

            if (
                data.type === "opacity"
            ) {

                applyOpacity(
                    data.value
                );

                addLog(
                    `透明度：${Math.round(
                        Number(data.value) * 100
                    )}%`
                );

                return;
            }


            /*
             * その他
             */

            addLog(
                `受信：${event.data}`
            );

        } catch (error) {

            addLog(
                `受信：${event.data}`
            );

        }

    };


    /*
     * 切断
     */

    socket.onclose = () => {

        statusText.textContent =
            "🔴 切断";


        addLog(
            "WebSocket切断"
        );


        count.textContent =
            "0台";

    };


    /*
     * エラー
     */

    socket.onerror = () => {

        statusText.textContent =
            "🔴 接続エラー";


        addLog(
            "WebSocketエラー"
        );

    };
}


/*
 * ==========================================
 * 接続ボタン
 * ==========================================
 */

connectButton.onclick =
    connect;


/*
 * ==========================================
 * コマンド送信
 * ==========================================
 */

function sendCommand(command) {

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {

        alert(
            "先に接続してください"
        );

        return;
    }


    socket.send(
        JSON.stringify(command)
    );


    addLog(
        `送信：${JSON.stringify(command)}`
    );
}


/*
 * ==========================================
 * 設定反映
 * ==========================================
 */

function applySettings(settings) {

    if (!settings) {
        return;
    }


    /*
     * カラー
     */

    if (
        Array.isArray(settings.colors)
    ) {

        renderSavedColors(
            settings.colors
        );

    }


    /*
     * 点滅
     */

    if (
        settings.blink
    ) {

        if (
            Number.isFinite(
                settings.blink.bpm
            )
        ) {

            bpmInput.value =
                settings.blink.bpm;

        }


        if (
            Array.isArray(
                settings.blink.pattern
            )
        ) {

            blinkPattern =
                settings.blink.pattern
                    .slice(0, 16)
                    .map(
                        value =>
                            value ? 1 : 0
                    );


            renderPattern();

        }

    }


    /*
     * MASTER透明度
     */

    if (
        settings.opacity !== undefined
    ) {

        applyOpacity(
            settings.opacity
        );

    } else {

        applyOpacity(1);

    }


    addLog(
        "ルーム設定を読み込みました"
    );
}


/*
 * ==========================================
 * 保存カラー表示
 * ==========================================
 */

function renderSavedColors(colors) {

    savedColors.innerHTML =
        "";


    colors.forEach(
        color => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "savedColor";


            button.style.backgroundColor =
                color;


            button.title =
                color;


            button.onclick = () => {

                sendCommand({
                    type: "color",
                    color
                });

            };


            savedColors.appendChild(
                button
            );

        }
    );
}


/*
 * ==========================================
 * カラー保存
 * ==========================================
 */

saveColorButton.onclick = () => {

    const color =
        normalizeColor(
            hexInput.value
        );


    if (!color) {

        alert(
            "HEXカラーを正しく入力してください"
        );

        return;
    }


    colorPicker.value =
        color;


    hexInput.value =
        color;


    sendCommand({
        type: "saveColor",
        color
    });
};


/*
 * ==========================================
 * 赤
 * ==========================================
 */

document
    .getElementById("red")
    .onclick = () => {

        sendCommand({
            type: "color",
            color: "#ff0000"
        });

    };


/*
 * ==========================================
 * 緑
 * ==========================================
 */

document
    .getElementById("green")
    .onclick = () => {

        sendCommand({
            type: "color",
            color: "#00ff00"
        });

    };


/*
 * ==========================================
 * 青
 * ==========================================
 */

document
    .getElementById("blue")
    .onclick = () => {

        sendCommand({
            type: "color",
            color: "#0000ff"
        });

    };


/*
 * ==========================================
 * 白
 * ==========================================
 */

document
    .getElementById("white")
    .onclick = () => {

        sendCommand({
            type: "color",
            color: "#ffffff"
        });

    };


/*
 * ==========================================
 * 点滅
 * ==========================================
 */

document
    .getElementById("blink")
    .onclick = () => {

        const bpm =
            Number(
                bpmInput.value
            ) || 120;


        sendCommand({
            type: "blink",
            bpm,
            pattern: blinkPattern
        });

    };


/*
 * ==========================================
 * 消灯
 * ==========================================
 */

document
    .getElementById("clear")
    .onclick = () => {

        sendCommand({
            type: "clear"
        });

    };


/*
 * ==========================================
 * ビートパターン
 * ==========================================
 */

beatButtons.forEach(
    button => {

        button.onclick = () => {

            const index =
                Number(
                    button.dataset.beat
                );


            blinkPattern[index] =
                blinkPattern[index]
                    ? 0
                    : 1;


            renderPattern();

        };

    }
);


/*
 * ==========================================
 * パターン表示
 * ==========================================
 */

function renderPattern() {

    beatButtons.forEach(
        button => {

            const index =
                Number(
                    button.dataset.beat
                );


            if (
                blinkPattern[index]
            ) {

                button.classList.add(
                    "active"
                );

                button.textContent =
                    "●";

            } else {

                button.classList.remove(
                    "active"
                );

                button.textContent =
                    "○";

            }

        }
    );
}


/*
 * ==========================================
 * 点滅設定保存
 * ==========================================
 */

saveBlinkButton.onclick = () => {

    let bpm =
        Number(
            bpmInput.value
        );


    if (!Number.isFinite(bpm)) {

        bpm = 120;

    }


    bpm =
        Math.max(
            20,
            Math.min(
                300,
                Math.round(bpm)
            )
        );


    bpmInput.value =
        bpm;


    sendCommand({
        type: "saveBlink",
        bpm,
        pattern: blinkPattern
    });
};


/*
 * ==========================================
 * 初期状態
 * ==========================================
 */

renderPattern();

applyOpacity(1);

</script>

</body>

</html>
